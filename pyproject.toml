[project]
name = "python-koans"
version = "0.1.0"
description = "Koans for Python OOP, then data structures and algorithms"
requires-python = ">=3.13"
dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-x -q --no-header -p no:cacheprovider --import-mode=importlib"
testpaths = ["koans"]
python_files = ["*_test.py", "test_*.py"]
