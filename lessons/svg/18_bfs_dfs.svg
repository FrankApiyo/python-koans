<circle cx="220" cy="130" r="16" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="220" y="135" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">F</text>
<text x="140" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">A B C D E</text>
<text x="400" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#ea580c" font-weight="bold">dfs('A')  recursion</text>
<line x1="320" y1="60" x2="400" y2="60" stroke="#6b7280" stroke-width="1.5"/>
<line x1="400" y1="60" x2="480" y2="60" stroke="#6b7280" stroke-width="1.5"/>
<line x1="320" y1="60" x2="320" y2="130" stroke="#6b7280" stroke-width="1.5"/>
<line x1="400" y1="60" x2="400" y2="130" stroke="#6b7280" stroke-width="1.5"/>
<line x1="320" y1="130" x2="400" y2="130" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="320" cy="60" r="16" fill="#fafaf9" stroke="#1f2937" stroke-width="1.5"/>
<text x="320" y="65" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">A</text>
<circle cx="337" cy="45" r="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/>
<text x="337" y="49" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<circle cx="400" cy="60" r="16" fill="#fafaf9" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="65" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">B</text>
<circle cx="417" cy="45" r="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/>
<text x="417" y="49" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<circle cx="480" cy="60" r="16" fill="#fafaf9" stroke="#1f2937" stroke-width="1.5"/>
<text x="480" y="65" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">D</text>
<circle cx="497" cy="45" r="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/>
<text x="497" y="49" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<circle cx="320" cy="130" r="16" fill="#fafaf9" stroke="#1f2937" stroke-width="1.5"/>
<text x="320" y="135" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">C</text>
<circle cx="337" cy="115" r="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/>
<text x="337" y="119" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<circle cx="400" cy="130" r="16" fill="#fafaf9" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="135" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">E</text>
<circle cx="417" cy="115" r="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/>
<text x="417" y="119" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<circle cx="480" cy="130" r="16" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="480" y="135" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">F</text>
<text x="400" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">A B D E C</text>
<text x="580" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">BFS: one step away, then two,</text>
<text x="580" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">so the first time it reaches a</text>
<text x="580" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">node is by a shortest path.</text>
<text x="580" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">DFS: follow one path to its end,</text>
<text x="580" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">then back up and try the next.</text>
<text x="580" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">Both keep a seen set; without it</text>
<text x="580" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">the cycle A B E C A never ends.</text>
</svg>
