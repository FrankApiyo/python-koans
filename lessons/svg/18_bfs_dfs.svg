<circle cx="237" cy="45" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="237" y="49" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<circle cx="60" cy="130" r="16" fill="#fafaf9" stroke="#1f2937" stroke-width="1.5"/>
<text x="60" y="135" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">C</text>
<circle cx="77" cy="115" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="77" y="119" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
