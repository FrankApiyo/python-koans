<text x="470" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="start" fill="#ea580c" font-weight="normal">parent of 3 is 1</text>
<text x="20" y="232" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold">_sift_down(0) on [9, 1, 2, 3, 4]</text>
