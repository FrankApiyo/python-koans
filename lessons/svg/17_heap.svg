<text x="300" y="140" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">parent(i) = (i - 1) // 2</text>
<text x="300" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">left(i)   = 2 * i + 1</text>
<text x="300" y="176" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">right(i)  = 2 * i + 2</text>
