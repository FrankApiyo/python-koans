<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Attribute lookup checks the instance dict, then the class dict">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="720" height="300" fill="#fafaf9"/>
<text x="20" y="30" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold">rex.species  before any assignment</text>
<rect x="20" y="50" width="250" height="70" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="145" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">vars(rex)</text>
<text x="145" y="95" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">name: "Rex"</text>
<rect x="420" y="50" width="280" height="70" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="560" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">vars(Dog)</text>
<text x="560" y="95" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">species: "Canis familiaris"  speak</text>
<line x1="270" y1="85" x2="415" y2="85" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="145" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">1  miss</text>
<text x="342" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="normal">2  look in the class</text>
<text x="560" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">hit: "Canis familiaris"</text>
<text x="20" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold">rex.species  after  rex.species = "wolf"</text>
<rect x="20" y="190" width="250" height="70" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="145" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">vars(rex)</text>
<text x="145" y="235" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">name: "Rex"  species: "wolf"</text>
<rect x="420" y="190" width="280" height="70" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="560" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">vars(Dog)</text>
<text x="560" y="235" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">species: "Canis familiaris"  speak</text>
<line x1="270" y1="225" x2="415" y2="225" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
<text x="342" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">never asked</text>
<text x="145" y="275" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">1  hit, stop here</text>
<text x="360" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">Assigning through an instance writes its own dict. The class dict is never changed.</text>
</svg>
