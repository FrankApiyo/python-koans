<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-label="A for loop calls iter once, then next until StopIteration">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="840" height="230" fill="#fafaf9"/>
<text x="20" y="30" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">for x in xs:</text>
<rect x="20" y="60" width="90" height="44" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="65.0" y="78.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">xs</text>
<text x="65.0" y="94.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">iterable</text>
<line x1="110" y1="82" x2="170" y2="82" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="140" y="72" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="normal">iter()</text>
<rect x="175" y="60" width="110" height="44" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="230.0" y="78.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">iterator</text>
<text x="230.0" y="94.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">has __next__</text>
<line x1="285" y1="82" x2="330" y2="82" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="307" y="72" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="normal">next()</text>
<rect x="330" y="64" width="40" height="36" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="350" y="87" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">10</text>
<text x="350" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">x = 10</text>
<line x1="395" y1="82" x2="440" y2="82" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="418" y="72" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="normal">next()</text>
<rect x="440" y="64" width="40" height="36" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="460" y="87" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">20</text>
<text x="460" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">x = 20</text>
<line x1="505" y1="82" x2="550" y2="82" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="528" y="72" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="normal">next()</text>
<rect x="550" y="64" width="40" height="36" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="570" y="87" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">30</text>
<text x="570" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">x = 30</text>
<line x1="700" y1="82" x2="745" y2="82" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="722" y="72" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="normal">next()</text>
<text x="722" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="normal">StopIteration</text>
<text x="722" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="normal">loop ends</text>
<text x="20" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">A list builds a fresh iterator on every iter(), so it survives a second loop.</text>
<text x="20" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">An iterator's __iter__ returns itself, so it is used up after one pass.</text>
<text x="20" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">A generator function does the __next__ bookkeeping for you: each yield is one next().</text>
</svg>
