<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="One event loop runs two tasks; each await hands control back and the loop resumes the task later">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="700" height="320" fill="#fafaf9"/>
<rect x="250" y="20" width="200" height="44" rx="4" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
<text x="350.0" y="38.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">event loop</text>
<text x="350.0" y="54.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">one thread, one task at a time</text>
<text x="240" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">await hands control back</text>
<text x="460" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">the loop resumes it later</text>
<text x="40" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#2563eb" font-weight="bold">task a</text>
<rect x="110" y="120" width="110" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="165.0" y="145.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">run</text>
<rect x="300" y="120" width="130" height="40" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="365" y="144" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal">await sleep()</text>
<rect x="510" y="120" width="110" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="565.0" y="145.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">resume</text>
<line x1="222" y1="140" x2="298" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="432" y1="140" x2="508" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="300" y1="118" x2="320" y2="66" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
<line x1="420" y1="66" x2="430" y2="118" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
<text x="40" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#ea580c" font-weight="bold">task b</text>
<rect x="110" y="230" width="110" height="40" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="165.0" y="255.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">run</text>
<rect x="300" y="230" width="130" height="40" rx="4" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="365" y="254" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#ea580c" font-weight="normal">await sleep()</text>
<rect x="510" y="230" width="110" height="40" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="565.0" y="255.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">resume</text>
<line x1="222" y1="250" x2="298" y2="250" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<line x1="432" y1="250" x2="508" y2="250" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<line x1="300" y1="228" x2="262" y2="66" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>
<line x1="448" y1="66" x2="430" y2="228" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>
<text x="350" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">a runs and awaits, b runs and awaits, the loop resumes whichever wakes first. time.sleep() never hands back, so everything waits.</text>
</svg>
