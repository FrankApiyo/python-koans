<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The diamond D(B, C) and the linear MRO Python derives from it">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="720" height="300" fill="#fafaf9"/>
<circle cx="150" cy="50" r="22" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="150" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text>
<circle cx="70" cy="140" r="22" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="70" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">B</text>
<circle cx="230" cy="140" r="22" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="230" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text>
<circle cx="150" cy="230" r="22" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="150" y="235" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">D</text>
<line x1="85.94473213191807" y1="122.06217635159217" x2="132.7265401904221" y2="69.43264228577516" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<line x1="214.05526786808193" y1="122.06217635159217" x2="167.2734598095779" y2="69.43264228577516" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<line x1="134.05526786808193" y1="212.06217635159217" x2="87.27345980957791" y2="159.43264228577516" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<line x1="165.94473213191807" y1="212.06217635159217" x2="212.7265401904221" y2="159.43264228577516" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<text x="150" y="275" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">arrows mean "inherits from"</text>
<text x="420" y="45" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold">D.__mro__</text>
<rect x="420" y="60" width="40" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="440.0" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">D</text>
<line x1="460" y1="75" x2="466" y2="75" stroke="#6b7280" stroke-width="1.5"/>
<rect x="466" y="60" width="40" height="30" rx="4" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
<text x="486.0" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">B</text>
<line x1="506" y1="75" x2="512" y2="75" stroke="#6b7280" stroke-width="1.5"/>
<rect x="512" y="60" width="40" height="30" rx="4" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
<text x="532.0" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">C</text>
<line x1="552" y1="75" x2="558" y2="75" stroke="#6b7280" stroke-width="1.5"/>
<rect x="558" y="60" width="40" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="578.0" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">A</text>
<line x1="598" y1="75" x2="604" y2="75" stroke="#6b7280" stroke-width="1.5"/>
<rect x="604" y="60" width="64" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="636.0" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">object</text>
<text x="420" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">left to right, each class once,</text>
<text x="420" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">a class always before its parents</text>
<path d="M 92 140 Q 150 100 208 140" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="150" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#ea580c" font-weight="bold">super() in B</text>
<text x="420" y="190" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">super() means the next class in the</text>
<text x="420" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">MRO of the object, so inside B it is C,</text>
<text x="420" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">the sibling, not A the parent.</text>
<text x="420" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#ea580c" font-weight="bold">A runs once, last, from C.</text>
</svg>
