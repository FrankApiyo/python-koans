<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Dijkstra relaxes the cheapest known node first; the route via C beats the direct edge to B">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="800" height="250" fill="#fafaf9"/>
<line x1="60" y1="120" x2="260" y2="60" stroke="#6b7280" stroke-width="1.5"/>
<text x="168.0" y="84.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">4</text>
<line x1="60" y1="120" x2="260" y2="180" stroke="#16a34a" stroke-width="2.5"/>
<text x="168.0" y="144.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">1</text>
<line x1="260" y1="180" x2="260" y2="60" stroke="#16a34a" stroke-width="2.5"/>
<text x="268.0" y="114.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">2</text>
<line x1="260" y1="60" x2="460" y2="120" stroke="#16a34a" stroke-width="2.5"/>
<text x="368.0" y="84.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">5</text>
<circle cx="60" cy="120" r="18" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="60" y="125" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">A</text>
<text x="60" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">dist 0</text>
<circle cx="260" cy="60" r="18" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="260" y="65" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">B</text>
<text x="230" y="32" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#16a34a" font-weight="normal">dist 4 → 3</text>
<circle cx="260" cy="180" r="18" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="260" y="185" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">C</text>
<text x="260" y="218" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">dist 1</text>
<circle cx="460" cy="120" r="18" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="460" y="125" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">D</text>
<text x="460" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">dist 8</text>
<text x="530" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">heap of (distance, node)</text>
<text x="530" y="82" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal">pop (0, A): B=4, C=1</text>
<text x="530" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#16a34a" font-weight="normal">pop (1, C): B=1+2=3 beats 4</text>
<text x="530" y="118" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal">pop (3, B): D=8</text>
<text x="530" y="136" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">pop (4, B): stale, skip</text>
<text x="530" y="154" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal">pop (8, D): done</text>
<text x="400" y="235" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">A node's distance is final when it is popped, because every entry still in the heap costs at least as much.</text>
</svg>
