<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="Two threads each read, add one and write a shared counter; interleaved, one increment is lost">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="700" height="320" fill="#fafaf9"/>
<text x="150" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">thread A</text>
<text x="400" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#ea580c" font-weight="bold">thread B</text>
<text x="600" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">count</text>
<rect x="60" y="50" width="180" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="150.0" y="67.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">n = count</text>
<text x="150.0" y="83.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">reads 0</text>
<rect x="570" y="50" width="60" height="42" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="76" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">0</text>
<line x1="600" y1="94" x2="600" y2="104" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="310" y="106" width="180" height="42" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="400.0" y="123.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">n = count</text>
<text x="400.0" y="139.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">reads 0 too</text>
<rect x="570" y="106" width="60" height="42" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">0</text>
<line x1="600" y1="150" x2="600" y2="160" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="60" y="162" width="180" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="150.0" y="179.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">count = n + 1</text>
<text x="150.0" y="195.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">writes 1</text>
<rect x="570" y="162" width="60" height="42" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="188" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">1</text>
<line x1="600" y1="206" x2="600" y2="216" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="310" y="218" width="180" height="42" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="400.0" y="235.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">count = n + 1</text>
<text x="400.0" y="251.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">writes 1 again</text>
<rect x="570" y="218" width="60" height="42" rx="4" fill="#fee2e2" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="244" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">1</text>
<line x1="60" y1="60" x2="60" y2="260" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
<text x="60" y="275" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">time</text>
<text x="600" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="normal">two increments, count is 1</text>
<text x="275" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">with lock: B cannot read until A has written, so B reads 1 and writes 2.</text>
</svg>
