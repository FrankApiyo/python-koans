<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="factorial(3) pushes four frames, then each returns into the one below">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="700" height="300" fill="#fafaf9"/>
<text x="150" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">frames pushed</text>
<text x="520" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">frames popped, top first</text>
<rect x="60" y="220" width="180" height="42" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="150" y="240" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(3)</text>
<text x="150" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">waiting on 3 * ...</text>
<line x1="150" y1="218" x2="150" y2="214" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="255" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#2563eb" font-weight="normal">calls factorial(2)</text>
<rect x="60" y="170" width="180" height="42" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="150" y="190" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(2)</text>
<text x="150" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">waiting on 2 * ...</text>
<line x1="150" y1="168" x2="150" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="255" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#2563eb" font-weight="normal">calls factorial(1)</text>
<rect x="60" y="120" width="180" height="42" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="150" y="140" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(1)</text>
<text x="150" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">waiting on 1 * ...</text>
<line x1="150" y1="118" x2="150" y2="114" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="255" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#2563eb" font-weight="normal">calls factorial(0)</text>
<rect x="60" y="70" width="180" height="42" rx="4" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
<text x="150" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(0)</text>
<text x="150" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">returns 1, the base case</text>
<rect x="430" y="220" width="180" height="42" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="520" y="240" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(3)</text>
<text x="520" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="normal">3 * 2 = 6</text>
<rect x="430" y="170" width="180" height="42" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="520" y="190" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(2)</text>
<text x="520" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="normal">2 * 1 = 2</text>
<line x1="520" y1="216" x2="520" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="625" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#16a34a" font-weight="normal">returns 2</text>
<rect x="430" y="120" width="180" height="42" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="520" y="140" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(1)</text>
<text x="520" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="normal">1 * 1 = 1</text>
<line x1="520" y1="166" x2="520" y2="172" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="625" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#16a34a" font-weight="normal">returns 1</text>
<rect x="430" y="70" width="180" height="42" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
<text x="520" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">factorial(0)</text>
<text x="520" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="normal">base case: 1</text>
<line x1="520" y1="116" x2="520" y2="122" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="625" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#16a34a" font-weight="normal">returns 1</text>
<text x="350" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">Every frame has its own n. The stack grows to the base case, then unwinds. About 1000 frames and Python raises RecursionError.</text>
</svg>
