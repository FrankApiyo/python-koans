<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A key is hashed, reduced modulo the bucket count, and found by walking one bucket">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="300" fill="#fafaf9"/>
<rect x="20" y="40" width="80" height="40" rx="4" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
<text x="60.0" y="65.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">"emu"</text>
<line x1="100" y1="60" x2="150" y2="60" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="125" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="normal">hash()</text>
<rect x="150" y="40" width="110" height="40" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="205.0" y="56.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">8 273 190</text>
<text x="205.0" y="72.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">an int</text>
<line x1="260" y1="60" x2="310" y2="60" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="285" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="normal">% 4</text>
<rect x="310" y="40" width="60" height="40" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="340.0" y="56.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2</text>
<text x="340.0" y="72.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">bucket</text>
<text x="430" y="134" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">0</text>
<rect x="460" y="110" width="280" height="36" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<rect x="470" y="115" width="100" height="26" rx="3" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="520" y="133" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">["dog", 1]</text>
<text x="430" y="176" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">1</text>
<rect x="460" y="152" width="280" height="36" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<text x="430" y="218" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">2</text>
<rect x="460" y="194" width="280" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="470" y="199" width="100" height="26" rx="3" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="520" y="217" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">["cat", 2]</text>
<rect x="580" y="199" width="100" height="26" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="630" y="217" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">["emu", 3]</text>
<text x="430" y="260" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">3</text>
<rect x="460" y="236" width="280" height="36" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<path d="M 340 80 Q 340 200 458 200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="20" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#2563eb" font-weight="normal">get walks bucket 2 comparing keys with ==</text>
<text x="600" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">buckets</text>
<text x="20" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">Two keys in one bucket is a collision.</text>
<text x="20" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">Buckets stay short, so the walk is a</text>
<text x="20" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">few steps: O(1) on average.</text>
<text x="20" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">When pairs outnumber buckets, double</text>
<text x="20" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">the buckets and re-place every pair.</text>
<text x="20" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">__hash__ picks the bucket, __eq__ finds the key inside it. They must agree or the key is never found.</text>
</svg>
