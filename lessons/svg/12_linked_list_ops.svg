<text x="380" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#ea580c" font-weight="normal">2  node_1.next = new</text>
<text x="380" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">Two assignments, no walking, however long the list.</text>
<text x="380" y="203" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">Node(value, next) does both: node_1.next = Node(2, node_1.next)</text>
<text x="20" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">reverse()  one loop step at a time</text>
