<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" role="img" aria-label="A stack pushes and pops at the same end; a queue joins at the back and leaves from the front">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="700" height="260" fill="#fafaf9"/>
<text x="130" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Stack  (LIFO)</text>
<rect x="90" y="200" width="80" height="36" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="130" y="224" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">a</text>
<rect x="90" y="160" width="80" height="36" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="130" y="184" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">b</text>
<rect x="90" y="120" width="80" height="36" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="130" y="144" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">c</text>
<text x="130" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">_items = [a, b, c]</text>
<line x1="40" y1="125" x2="85" y2="125" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="40" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal">push</text>
<line x1="175" y1="125" x2="220" y2="125" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<text x="220" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#ea580c" font-weight="normal">pop</text>
<text x="130" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="normal">top</text>
<text x="500" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Queue  (FIFO)</text>
<rect x="400" y="120" width="60" height="40" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="430" y="145" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">a</text>
<rect x="470" y="120" width="60" height="40" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="500" y="145" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">b</text>
<rect x="540" y="120" width="60" height="40" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="570" y="145" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">c</text>
<text x="500" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="end" fill="#2563eb" font-weight="normal">front</text>
<text x="430" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal"></text>
<line x1="340" y1="140" x2="395" y2="140" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<text x="365" y="125" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#ea580c" font-weight="normal">dequeue</text>
<line x1="620" y1="140" x2="665" y2="140" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="640" y="125" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="normal">enqueue</text>
<text x="500" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">list.pop(0) shifts b and c left: O(n).</text>
<text x="500" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">deque.popleft() moves nothing: O(1).</text>
</svg>
